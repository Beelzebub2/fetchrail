[package]
name = "fetchrail-android-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "fetchrail_android_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
