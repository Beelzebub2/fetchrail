name: Update feed checks
on:
  push:
    branches: [main]
    paths:
      - 'update-service/**'
      - '.github/workflows/update-service.yml'
  pull_request:
    paths:
      - 'update-service/**'
      - '.github/workflows/update-service.yml'
permissions:
  contents: read
concurrency:
  group: update-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: update-service/package-lock.json
      - run: npm ci --prefix update-service
      - run: npm test --prefix update-service
