name: Firefox Add-ons

on:
  workflow_call:
    inputs:
      policy_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      policy_only:
        description: Repair or update the AMO privacy policy without resubmitting the version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firefox-amo-publish
  cancel-in-progress: false

jobs:
  submit:
    name: Submit Firefox companion to AMO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check version and build Firefox companion
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then node scripts/check-release.mjs "$GITHUB_REF_NAME"; else node scripts/check-release.mjs; fi
          npm ci
          npm ci --prefix browser-extension/publisher
          npm run browser:build
          npm run browser:check
          npm run amo:test
          npm run amo:lint
      - name: Package readable sources for Mozilla reviewers
        if: ${{ !inputs.policy_only }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          mkdir -p artifacts/firefox-add-ons
          zip -qr "artifacts/firefox-add-ons/source-${version}.zip" \
            browser-extension/src browser-extension/manifests browser-extension/build.mjs \
            browser-extension/README.md browser-extension/privacy-policy.txt \
            package.json package-lock.json
      - name: Check Mozilla credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo '::error::Set AMO_JWT_ISSUER and AMO_JWT_SECRET as GitHub Actions repository secrets.'
            exit 1
          fi
      - name: Submit listed Firefox release to Mozilla
        if: ${{ !inputs.policy_only }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          node browser-extension/publisher/node_modules/web-ext/bin/web-ext.js sign \
            --source-dir browser-extension/dist/firefox \
            --channel listed \
            --amo-metadata browser-extension/amo-metadata.json \
            --upload-source-code "artifacts/firefox-add-ons/source-${version}.zip" \
            --approval-timeout 0 \
            --artifacts-dir artifacts/firefox-add-ons \
            --no-input
      - name: Publish and verify Firefox privacy policy
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/firefox-add-ons-policy.mjs
