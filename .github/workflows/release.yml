name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'website/**'
      - '.gitignore'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # Tag caches cannot be reused by other tags; seed the shared cache on main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check release version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/check-release.mjs "$env:GITHUB_REF_NAME"
          } else {
            node scripts/check-release.mjs
          }
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and extensions
        run: npm run build
      - name: Check extension behaviour
        run: npm run browser:check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows executable
        run: npm run release:build
      - name: Check bundled interface and native bridge
        run: |
          $app = Start-Process -FilePath "$PWD/src-tauri/target/release/fetchrail.exe" -ArgumentList '--background' -WindowStyle Hidden -PassThru
          try {
            $config = Join-Path $env:APPDATA 'com.rrmtools.braid/browser-bridge.json'
            $deadline = (Get-Date).AddSeconds(45)
            while (-not (Test-Path -LiteralPath $config)) {
              if ($app.HasExited -or (Get-Date) -ge $deadline) { throw 'Fetchrail did not start its browser bridge.' }
              Start-Sleep -Milliseconds 250
            }
            npm run browser:test -- --frontend
            if ($LASTEXITCODE -ne 0) { throw 'Bundled interface startup check failed.' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force; $app.WaitForExit() }
          }
      - name: Test real multi-connection transfers
        run: npm run engine:test
      - name: Test setup and removal
        run: npm run setup:test
      - name: Package and sign release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Installed copies only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The TAURI_SIGNING_PRIVATE_KEY secret is missing.' }
          ./scripts/package-release.ps1 -Tag "$env:GITHUB_REF_NAME"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @("release-artifacts/Fetchrail-Setup-$tag-windows-x64.exe", "release-artifacts/Fetchrail-Setup-$tag-windows-x64.sha256", "release-artifacts/latest.json")
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag @assets --verify-tag --title "Fetchrail $tag" --generate-notes --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          gh release edit $tag --title "Fetchrail $tag" --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release title update failed.' }

  chrome-web-store:
    name: Chrome Web Store
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check release and build extension
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          npm ci
          npm run cws:test
          npm run browser:build
      - name: Prepare production extension package
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/prepare-chrome-web-store.mjs "$GITHUB_REF_NAME"
          mkdir -p release-artifacts
          (cd "release-artifacts/chrome-web-store-$version" && zip -qr "../chrome-web-store-$version.zip" .)
      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Submit extension update
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          export CWS_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/chrome-web-store.mjs publish "release-artifacts/chrome-web-store-${CWS_VERSION}.zip"
