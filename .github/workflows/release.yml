name: Release
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Build / {0}', github.head_ref || github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run completion benchmarks and retain raw evidence
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  extension-changes:
    name: Check browser extension changes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      chromium: ${{ steps.check.outputs.chromium }}
      opera: ${{ steps.check.outputs.opera }}
      firefox: ${{ steps.check.outputs.firefox }}
      firefox_policy: ${{ steps.check.outputs.firefox_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Compare extension contents with last successful store submissions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERA_INITIAL_SUBMISSION_REF: ${{ vars.OPERA_INITIAL_SUBMISSION_REF }}
        run: node scripts/extension-release-changes.mjs "$GITHUB_REF_NAME"

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # Tag caches cannot be reused by other tags; seed the shared cache on main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check release version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/check-release.mjs "$env:GITHUB_REF_NAME"
          } else {
            node scripts/check-release.mjs
          }
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend and extensions
        run: npm run build
      - name: Check extension behaviour
        run: npm run browser:check
      - name: Test progress and torrent interfaces
        run: |
          npm run ui:test
          if ($LASTEXITCODE -ne 0) { throw 'Progress interface checks failed.' }
          npm run torrent:ui
          if ($LASTEXITCODE -ne 0) { throw 'Torrent interface checks failed.' }
          npm run diagnostics:ui
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics interface checks failed.' }
          npm run analytics:ui
          if ($LASTEXITCODE -ne 0) { throw 'Analytics interface checks failed.' }
      - name: Retain Windows interface evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-windows-ui
          path: artifacts/torrent-ui-*
          if-no-files-found: warn
      - name: Check release tooling and build store package
        run: |
          npm run release:test
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling checks failed.' }
          npm run cws:test
          if ($LASTEXITCODE -ne 0) { throw 'Chrome Web Store checks failed.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:CWS_OUTPUT = "$PWD/artifacts/chrome-web-store-$version"
          node scripts/prepare-chrome-web-store.mjs "v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Production extension packaging failed.' }
          Compress-Archive -Path "$env:CWS_OUTPUT/*" -DestinationPath "artifacts/chrome-web-store-$version.zip"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: 96d5fb3de135b86d7222c53f2352ca92827a156b
          path: .native-vcpkg
          persist-credentials: false
      - name: Identify native build cache
        id: native-cache-image
        run: |
          if (-not $env:ImageVersion) { throw 'Hosted Windows image version is missing.' }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Windows native binary cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: native-windows-2022-96d5fb3-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('src-tauri/native/ports/**', 'src-tauri/native/triplets/x64-windows-static.cmake', 'scripts/build-torrent-deps.ps1') }}
          # vcpkg checks compiler, port and dependency ABI hashes before reuse.
          restore-keys: native-windows-2022-96d5fb3-
      - name: Build native torrent dependencies
        run: |
          ./.native-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          ./scripts/build-torrent-deps.ps1 -VcpkgRoot "$PWD/.native-vcpkg"
      - name: Save Windows native binary cache
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Generate dependency inventory and notices
        run: node scripts/release-notices.mjs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins --features tauri/custom-protocol,test-tools --locked
      - name: Check signed artifact verification
        run: node scripts/test-signatures.mjs
      - name: Check bundled interface and native bridge
        run: node scripts/smoke-desktop.mjs
      - name: Test real multi-connection transfers
        run: npm run engine:test
      - name: Test bounded HTTP transfer slot reuse
        run: node scripts/test-http-slot-reuse.mjs src-tauri/target/release/fetchrail.exe
      - name: Test retained Firefox companion handoffs
        run: node scripts/test-local-companion.mjs
      - name: Test real torrent swarms
        run: |
          npm run torrent:test
          if ($LASTEXITCODE -ne 0) { throw 'Torrent swarm checks failed.' }
          npm run torrent:diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Torrent diagnostic alert checks failed.' }
          npm run torrent:listeners
      - name: Test packaged torrent integration
        run: node scripts/test-torrent-desktop.mjs src-tauri/target/release/fetchrail.exe src-tauri/target/release/torrent-harness.exe
      - name: Test setup and removal
        run: npm run setup:test
      - name: Build and verify the production executable without test tools
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin fetchrail --no-default-features --features tauri/custom-protocol --locked
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }
          node scripts/smoke-desktop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Production frontend and native bridge checks failed.' }
          node scripts/test-local-companion.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Production companion handoff checks failed.' }
      - name: Package Windows build without release secrets
        if: github.ref_type != 'tag'
        run: ./scripts/package-release.ps1 -FragmentOnly
      - name: Upload Windows development assets
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-windows-x64
          path: |
            release-artifacts/*
            artifacts/chrome-web-store-*.zip
          if-no-files-found: error
      - name: Benchmark HTTP completion
        if: inputs.benchmark == true
        run: npm run engine:bench
      - name: Retain benchmark evidence
        if: inputs.benchmark == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-windows
          path: artifacts/benchmarks/*
      - name: Package and sign release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Installed copies only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The TAURI_SIGNING_PRIVATE_KEY secret is missing.' }
          ./scripts/package-release.ps1 -Tag "$env:GITHUB_REF_NAME" -FragmentOnly
      - name: Upload Windows release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            release-artifacts/*
            src-tauri/target/release/verify-update.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      GDK_BACKEND: x11
      XDG_SESSION_TYPE: x11
      XDG_CURRENT_DESKTOP: Xvfb
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Linux dependencies
        run: bash scripts/linux-dependencies.sh
      - name: Check Linux portable integration
        run: bash scripts/test-linux-integration.sh
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/native/vcpkg
            src-tauri/native/installed-secure
          key: native-${{ matrix.runner }}-96d5fb3-${{ hashFiles('src-tauri/native/ports/**', 'src-tauri/native/triplets/*-linux.cmake', 'scripts/build-torrent-deps.sh') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate version and install frontend
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then node scripts/check-release.mjs "$GITHUB_REF_NAME"; else node scripts/check-release.mjs; fi
          npm ci
      - name: Build pinned native torrent dependencies
        run: bash scripts/build-torrent-deps.sh
      - name: Build frontend and check extension behavior
        run: |
          npm run build
          npm run browser:check
          npm run release:test
      - name: Generate dependency inventory and bundled notices
        run: node scripts/release-notices.mjs
      - name: Install Linux UI test browser
        run: npx playwright install --with-deps chromium
      - name: Check Linux progress and torrent interfaces
        run: |
          npm run ui:test
          npm run torrent:ui
          npm run diagnostics:ui
          npm run analytics:ui
      - name: Check Rust and native transfer correctness
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-qualification
          {
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
            cargo test --manifest-path src-tauri/Cargo.toml --locked
          } 2>&1 | tee artifacts/linux-qualification/rust-checks.log
      - name: Build embedded Linux executables
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bins --features tauri/custom-protocol,test-tools --locked
      - name: Test real torrent diagnostic alerts
        run: node scripts/test-torrent-diagnostics.mjs src-tauri/target/release/torrent-harness
      - name: Check signed artifact verification
        run: node scripts/test-signatures.mjs
      - name: Check ELF dependencies
        run: |
          ldd src-tauri/target/release/fetchrail | tee elf-dependencies.txt
          ! grep -q 'not found' elf-dependencies.txt
      - name: Run actual WebKitGTK desktop and HTTP fixtures
        # Keep X11 available while restart recovery closes the last app connection.
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- npm run linux:qualify
      - name: Install native WebKitGTK desktop test driver
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver weston
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Test native settings, autostart and progress windows
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- npm run linux:desktop
      - name: Test native Wayland settings and progress windows
        run: npm run linux:wayland
      - name: Build and verify the production executable without test tools
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin fetchrail --no-default-features --features tauri/custom-protocol --locked
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- node scripts/smoke-desktop.mjs
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- node scripts/test-local-companion.mjs
      - name: Build Linux packages without release secrets
        if: github.ref_type != 'tag'
        run: |
          npm run tauri -- bundle --config src-tauri/tauri.linux.unsigned.conf.json
          node scripts/package-linux.mjs --unsigned
      - name: Build and sign Linux packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri -- bundle
          node scripts/package-linux.mjs "$GITHUB_REF_NAME"
      - name: Inspect package contents and desktop entries
        run: |
          deb=$(find src-tauri/target/release/bundle -name '*.deb' -print -quit)
          rpm=$(find src-tauri/target/release/bundle -name '*.rpm' -print -quit)
          test -n "$deb" && test -n "$rpm"
          dpkg-deb --info "$deb"
          rpm -qp --requires "$rpm"
          desktop=$(mktemp -d)
          dpkg-deb --extract "$deb" "$desktop"
          find "$desktop/usr/share/applications" -name '*.desktop' -exec desktop-file-validate {} +
          sudo apt-get install -y "$(realpath "$deb")"
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- node scripts/smoke-desktop.mjs /usr/bin/fetchrail
          sudo apt-get remove -y fetchrail
          image=$(find src-tauri/target/release/bundle -name '*.AppImage' -print -quit)
          test -n "$image"
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- node scripts/smoke-desktop.mjs "$image"
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- node scripts/test-linux-appimage.mjs "$image"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then archive_root=release-artifacts; else archive_root=artifacts/linux-development; fi
          archive=$(find "$archive_root" -name '*.tar.gz' -print -quit)
          test -n "$archive"
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- node scripts/test-linux-archive.mjs "$archive"
      - name: Benchmark HTTP completion
        if: inputs.benchmark == true
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" dbus-run-session -- npm run engine:bench
      - name: Stage installed-package distro fixtures
        if: matrix.arch == 'x64'
        run: |
          mkdir -p artifacts/distro-inputs
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm artifacts/distro-inputs/
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then archive_root=release-artifacts; else archive_root=artifacts/linux-development; fi
          cp "$archive_root"/*.tar.gz artifacts/distro-inputs/
          cp src-tauri/target/release/torrent-harness "$HOME/.cargo/bin/tauri-driver" artifacts/distro-inputs/
          cp -L "$(command -v node)" artifacts/distro-inputs/node
          cp -a browser-extension artifacts/distro-inputs/
      - name: Retain private CI distro fixture inputs
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-inputs-x64
          path: artifacts/distro-inputs/*
          if-no-files-found: error
      - name: Retain Linux qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-linux-${{ matrix.arch }}
          path: |
            artifacts/linux-qualification/*
            artifacts/linux-development/*
            artifacts/benchmarks/*
            elf-dependencies.txt
          if-no-files-found: warn
      - name: Upload Linux release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  distros:
    name: Installed Linux package / ${{ matrix.distro }}
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora44, mint223, kali, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distro-inputs-x64
          path: artifacts/distro-inputs
      - name: Install userspace fixture tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl xz-utils xorriso squashfs-tools xvfb
      - name: Test package, HTTP, torrents and native X11/Wayland controls
        env:
          FETCHRAIL_SOURCE_REVISION: ${{ github.sha }}
        run: |
          chmod +x artifacts/distro-inputs/node artifacts/distro-inputs/tauri-driver artifacts/distro-inputs/torrent-harness
          sudo --preserve-env=FETCHRAIL_SOURCE_REVISION bash scripts/test-linux-distro.sh '${{ matrix.distro }}' artifacts/distro-inputs
      - name: Retain distro evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.distro }}
          path: artifacts/linux-qualification/${{ matrix.distro }}/*
          if-no-files-found: warn

  update-service:
    name: Update feed security and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: update-service/package-lock.json
      - run: npm ci --prefix update-service
      - run: npm test --prefix update-service

  publish:
    name: Verify and publish one complete release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, distros, update-service, extension-changes]
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      manifest_sha256: ${{ steps.release-manifest.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: incoming
      - name: Collect and cryptographically verify assets
        id: release-manifest
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Get-ChildItem incoming -Recurse -File | ForEach-Object {
            if ($_.Name -eq 'verify-update.exe') {
              Copy-Item -LiteralPath $_.FullName -Destination release-artifacts/verify-update.exe
            } elseif ($_.Name -notin @('THIRD_PARTY_NOTICES.txt', 'dependency-inventory.json')) {
              $target = Join-Path release-artifacts $_.Name
              if (Test-Path -LiteralPath $target) { throw "Duplicate release asset $($_.Name)" }
              Copy-Item -LiteralPath $_.FullName -Destination $target
            } else {
              $relative = [IO.Path]::GetRelativePath("$PWD/incoming", $_.FullName)
              $sourceArtifact = ($relative -split '[\\/]')[0]
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path release-artifacts "$sourceArtifact-$($_.Name)")
            }
          }
          $env:FETCHRAIL_SIGNATURE_VERIFIER = "$PWD/release-artifacts/verify-update.exe"
          node scripts/aggregate-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Combined release verification failed.' }
          $manifestDigest = (Get-FileHash -LiteralPath release-artifacts/latest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$manifestDigest" >> $env:GITHUB_OUTPUT
      - name: Publish validated draft and then latest metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          node scripts/release-notes.mjs $tag release-artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release note generation failed; no draft was created.' }
          $inventory = Get-Content -LiteralPath release-artifacts/release-inventory.json -Raw | ConvertFrom-Json
          $assetNames = @($inventory.files.name) + @('release-metadata.tar.gz', 'SHA256SUMS')
          $assets = $assetNames | ForEach-Object { (Get-Item -LiteralPath (Join-Path release-artifacts $_)).FullName }
          gh release create $tag @assets --draft --verify-tag --title "Fetchrail $tag" --notes-file release-artifacts/release-notes.md --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release upload $tag release-artifacts/latest.json --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Latest manifest publication failed; release remains a draft.' }
          gh release edit $tag --draft=false --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release remains a draft.' }

  notify-updates:
    name: Announce published update to Fetchrail
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Retrieve verified manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release-artifacts
      - name: Notify authenticated release feed
        env:
          FETCHRAIL_MANIFEST_SHA256: ${{ needs.publish.outputs.manifest_sha256 }}
        run: node scripts/notify-update-feed.mjs release-artifacts/latest.json

  chrome-web-store:
    name: Chrome Web Store
    needs: [publish, extension-changes]
    if: github.ref_type == 'tag' && needs.extension-changes.outputs.chromium == 'true'
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check release and build extension
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          npm ci
          npm run cws:test
          npm run browser:build
      - name: Prepare production extension package
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/prepare-chrome-web-store.mjs "$GITHUB_REF_NAME"
          mkdir -p release-artifacts
          (cd "release-artifacts/chrome-web-store-$version" && zip -qr "../chrome-web-store-$version.zip" .)
      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Submit extension update
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          export CWS_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/chrome-web-store.mjs publish "release-artifacts/chrome-web-store-${CWS_VERSION}.zip"

  firefox-add-ons:
    name: Firefox Add-ons
    needs: [publish, extension-changes]
    if: github.ref_type == 'tag' && (needs.extension-changes.outputs.firefox == 'true' || needs.extension-changes.outputs.firefox_policy == 'true')
    uses: ./.github/workflows/firefox-add-ons.yml
    with:
      policy_only: ${{ needs.extension-changes.outputs.firefox != 'true' }}
    secrets: inherit

  opera-add-ons:
    name: Opera Add-ons
    needs: [publish, extension-changes]
    if: github.ref_type == 'tag' && needs.extension-changes.outputs.opera == 'true'
    concurrency:
      group: opera-add-ons-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check release and build extension
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          npm ci
          npm run browser:build
          npm run browser:check
          npm run cws:test
      - name: Prepare Opera production extension package
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/prepare-chrome-web-store.mjs "$GITHUB_REF_NAME"
          mkdir -p release-artifacts
          (cd "release-artifacts/chrome-web-store-$version" && zip -qr "../opera-addons-$version.zip" .)
          unzip -p "release-artifacts/opera-addons-$version.zip" manifest.json | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(data);
              if (manifest.version !== process.argv[1] || manifest.manifest_version !== 3 || manifest.key || manifest.update_url) {
                throw new Error("Invalid Opera production manifest");
              }
            });
          ' "$version"
      - name: Verify Opera publisher configuration
        env:
          OPERA_SESSION_ID: ${{ secrets.OPERA_SESSION_ID }}
          OPERA_PACKAGE_ID: ${{ vars.OPERA_PACKAGE_ID }}
        run: |
          if [ -z "$OPERA_SESSION_ID" ] || [ -z "$OPERA_PACKAGE_ID" ]; then
            echo "Opera publisher configuration is missing. Set repository variable OPERA_PACKAGE_ID and secret OPERA_SESSION_ID." >&2
            exit 1
          fi
      - name: Submit Opera Add-ons update
        env:
          OPERA_SESSION_ID: ${{ secrets.OPERA_SESSION_ID }}
          OPERA_PACKAGE_ID: ${{ vars.OPERA_PACKAGE_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./node_modules/.bin/publish-extension --opera-zip "release-artifacts/opera-addons-$version.zip"
