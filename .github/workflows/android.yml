name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "src-tauri/src/network.rs"
      - "src-tauri/src/rate_limit.rs"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src-tauri/src/network.rs"
      - "src-tauri/src/rate_limit.rs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-debug:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: android/rust -> target
      - name: Verify shared Rust engine
        run: |
          cargo fmt --manifest-path android/rust/Cargo.toml -- --check
          cargo test --manifest-path android/rust/Cargo.toml --locked
      - name: Build ARM64 native download engine
        run: |
          cargo install cargo-ndk --locked
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk --platform 34 -t arm64-v8a -o android/app/src/main/jniLibs build --release --locked --manifest-path android/rust/Cargo.toml
          test -s android/app/src/main/jniLibs/arm64-v8a/libfetchrail_android_engine.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Assemble APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetchrail-android-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
